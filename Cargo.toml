[package]
name = "wkit"
description = "One CLI for versioning, formatting, checking, building and testing C, C++ and Rust projects"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
authors = ["whs31 <kerbalspacefruit@gmail.com>"]
homepage = "https://github.com/whs31/wkit"
repository = "https://github.com/whs31/wkit"
keywords = ["cli", "build", "conan", "cmake", "cargo"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/LICENSE", "/README.md"]

[package.metadata.deb]
extended-description = "wkit versions, formats, checks, builds, tests, packages and installs C, C++ and Rust projects described by a small wkit.toml, and keeps multi-repo workspaces in sync."
section = "devel"
priority = "optional"
depends = "$auto, git"
assets = [
  ["target/release/wkit", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/wkit/README.md", "644"],
]

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "string", "wrap_help"] }
derive_more = { version = "2", features = ["display"] }
flate2 = "1"
fs-err = "3"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
jiff = "0.2"
lazy-regex = "3"
rayon = "1"
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
smart-default = "0.7"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = "3"
which = "8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
