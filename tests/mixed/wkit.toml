[project]
name = "fallback-points"
description = "Conan C++ library and a Rust crate sharing one version"
languages = ["cpp", "rust"]

[version]
source = "conanfile.py"
files = ["conanfile.py", "CMakeLists.txt", "Cargo.toml"]

[build]
system = "conan"

[[test.suite]]
runner = "cargo"

[[test.suite]]
runner = "ctest"
