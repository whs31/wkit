[project]
name = "crc8"
description = "Plain CMake C project without Conan, tested through ctest"
languages = ["c"]
default-run = "crc8sum"

[version]
files = ["CMakeLists.txt"]

[build]
system = "cmake"

[[bin]]
name = "crc8sum"
path = "build/default/crc8sum{exe}"
args = ["hello"]

[[test.suite]]
runner = "ctest"

[package]
files = [{ from = "README.md", to = "/usr/share/doc/crc8/" }]

[package.deb]
maintainer = "wkit tests <wkit@example.com>"
section = "utils"
depends = ["libc6"]

[package.windows]
generator = "zip"

[install]
files = [{ from = "build/default/crc8sum{exe}", to = "/usr/local/bin/crc8sum", mode = "755" }]
